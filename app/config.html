<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
  <title>Keyboard config</title>
  <script defer src="js/debounce_config.js"></script>
  <script defer src="js/predict_core.js"></script>
  <script defer src="js/predict_config.js"></script>
  <script defer src="js/config.js"></script>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; background: #111; color: #eee;
      font-family: sans-serif; font-size: 16px; }
    body { padding: 8px 10px 24px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 22px 0 4px; padding-top: 10px; border-top: 2px solid #d98aa8; }
    h3 { font-size: 15px; margin: 14px 0 4px; color: #ccc; }
    p.hint { color: #aaa; font-size: 12px; margin: 0 0 12px; }
    .row { display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 7px 0; border-bottom: 1px solid #333; }
    .row label { flex: 1; }
    .row input[type=tel] { width: 78px; font-size: 16px; padding: 6px 4px;
      background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; }
    .row input[type=checkbox] { width: 26px; height: 26px; }
    .stack label { display: block; font-size: 14px; margin: 8px 0 3px; }
    .stack input[type=text], .stack input[type=tel], textarea {
      box-sizing: border-box; width: 100%; font-size: 15px; padding: 8px 6px;
      background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; }
    textarea { font-family: monospace; font-size: 13px; min-height: 180px; white-space: pre; }
    .buttons { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button { font-size: 15px; min-height: 42px; padding: 8px 12px; border-radius: 6px;
      border: 1px solid #666; background: #2a2a2a; color: #fff; }
    button:focus, input:focus, textarea:focus { outline: 3px solid #d98aa8; outline-offset: 1px; }
    .status { margin-top: 12px; font-size: 14px; color: #9f9; white-space: pre-wrap; }
    .status.error { color: #f88; }
    #pr-test-out { margin-top: 8px; padding: 8px; background: #1b1b1b; border: 1px solid #333;
      border-radius: 4px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <h1>Keyboard debounce</h1>
  <p class="hint">Saved in the keyboard app's local storage. Applies within ~1 second and survives reboot.</p>

  <div class="row"><label for="enabled">Enabled</label>
    <input id="enabled" type="checkbox"></div>
  <div class="row"><label for="GAP_HARD">Hard gap (ms)</label>
    <input id="GAP_HARD" type="tel" inputmode="numeric" pattern="[0-9]*"></div>
  <div class="row"><label for="GAP_SOFT">Soft gap (ms)</label>
    <input id="GAP_SOFT" type="tel" inputmode="numeric" pattern="[0-9]*"></div>
  <div class="row"><label for="HOLD_SHORT">Short hold (ms)</label>
    <input id="HOLD_SHORT" type="tel" inputmode="numeric" pattern="[0-9]*"></div>
  <div class="row"><label for="COOLDOWN_T9">Cooldown: T9 predictive (ms)</label>
    <input id="COOLDOWN_T9" type="tel" inputmode="numeric" pattern="[0-9]*"></div>
  <div class="row"><label for="COOLDOWN_Abc">Cooldown: Abc (ms)</label>
    <input id="COOLDOWN_Abc" type="tel" inputmode="numeric" pattern="[0-9]*"></div>
  <div class="row"><label for="COOLDOWN_abc">Cooldown: abc (ms)</label>
    <input id="COOLDOWN_abc" type="tel" inputmode="numeric" pattern="[0-9]*"></div>
  <div class="row"><label for="COOLDOWN_ABC">Cooldown: ABC (ms)</label>
    <input id="COOLDOWN_ABC" type="tel" inputmode="numeric" pattern="[0-9]*"></div>
  <div class="row"><label for="COOLDOWN_123">Cooldown: 123 (ms)</label>
    <input id="COOLDOWN_123" type="tel" inputmode="numeric" pattern="[0-9]*"></div>
  <div class="row"><label for="SELECT_COOLDOWN">Select cooldown (ms)</label>
    <input id="SELECT_COOLDOWN" type="tel" inputmode="numeric" pattern="[0-9]*"></div>
  <div class="row"><label for="showMarker">Show JS marker (left edge)</label>
    <input id="showMarker" type="checkbox"></div>
  <div class="row"><label for="debug">Debug console log</label>
    <input id="debug" type="checkbox"></div>

  <div class="buttons">
    <button id="save" type="button">Save</button>
    <button id="reload" type="button">Reload</button>
    <button id="defaults" type="button">Defaults</button>
    <button id="profile-100ms" type="button">100 ms cooldown</button>
    <button id="profile-1s" type="button">1 s cooldown</button>
  </div>
  <div id="status" class="status">Loading…</div>

  <h2>Prediction rules</h2>
  <p class="hint">Predictive (T9) mode only. Reorders TouchPal's word list for a digit
    sequence, e.g. 4 → "I". Saved rules apply within ~1 second.</p>

  <div class="row"><label for="pr-enabled">Enabled</label>
    <input id="pr-enabled" type="checkbox"></div>

  <div class="stack">
    <label for="pr-json">Rules JSON (digits → rule)</label>
    <textarea id="pr-json" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
  </div>
  <div class="buttons">
    <button id="pr-validate" type="button">Validate</button>
    <button id="pr-save" type="button">Save</button>
    <button id="pr-defaults" type="button">Reset to defaults</button>
  </div>

  <h3>Load from URL</h3>
  <div class="stack">
    <label for="pr-url">URL (must send CORS headers)</label>
    <input id="pr-url" type="text" autocapitalize="off" autocomplete="off" spellcheck="false"
      value="https://keyboard.elliscode.com/rules/predict.json">
  </div>
  <div class="buttons">
    <button id="pr-load" type="button">Load</button>
  </div>
  <div id="pr-status" class="status"></div>

  <h3>Test a rule</h3>
  <div class="stack">
    <label for="pr-test-digits">Digits</label>
    <input id="pr-test-digits" type="tel" inputmode="numeric" pattern="[0-9]*" value="4663">
    <label for="pr-test-prev">Previous word (blank = none / start)</label>
    <input id="pr-test-prev" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" value="headed">
    <label for="pr-test-list">TouchPal list (comma-separated)</label>
    <input id="pr-test-list" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" value="good, home, gone, hood">
  </div>
  <div id="pr-test-out">…</div>
</body>
</html>
