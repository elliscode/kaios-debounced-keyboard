<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" width="680" height="312" role="img" aria-label="Debounce rule windows on a 0 to 120 ms axis">
<title>Debounce rule windows on a 0 to 120 ms axis</title>
<style>
  .t { fill: #222; font-family: sans-serif; font-size: 14px; }
  .b { font-weight: bold; }
  .s { fill: #555; font-family: sans-serif; font-size: 12px; }
  .in { fill: #fff; font-family: sans-serif; font-size: 13px; font-weight: bold; }
  .ind { fill: #222; font-family: sans-serif; font-size: 13px; font-weight: bold; }
  .ax { stroke: #777; stroke-width: 1; fill: none; }
  .grid { stroke: #bbb; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  .sig { stroke: #111; stroke-width: 2.5; fill: none; }
  .bnc { stroke: #d62828; stroke-width: 2.5; fill: none; }
  .bncl { stroke: #d62828; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
  .bt { fill: #d62828; font-family: sans-serif; font-size: 12px; font-weight: bold; }
  @media (prefers-color-scheme: dark) {
    .t { fill: #e6e6e6; }
    .s { fill: #aaa; }
    .ax { stroke: #999; }
    .grid { stroke: #555; }
    .sig { stroke: #f2f2f2; }
    .bnc, .bncl { stroke: #ff5c5c; }
    .bt { fill: #ff6b6b; }
  }
</style>
<text class="t b" x="30" y="22">Gap rules: clock starts when you let go of the key</text>
<text class="s" x="30" y="40">time from the last kept release of the same key to the next press</text>
<rect x="30.0" y="50" width="232.5" height="34" fill="#c8323c"/>
<text class="in" x="146.2" y="72" text-anchor="middle">always drop</text>
<rect x="262.5" y="50" width="77.5" height="34" fill="#f0b429"/>
<text class="ind" x="301.2" y="72" text-anchor="middle">?</text>
<rect x="340.0" y="50" width="310.0" height="34" fill="#2e8b57"/>
<text class="in" x="495.0" y="72" text-anchor="middle">keep</text>
<text class="s" x="146.2" y="100" text-anchor="middle">Hard gap</text>
<text class="s" x="301.2" y="100" text-anchor="middle">Soft gap</text>
<line class="ax" x1="30" y1="108" x2="650" y2="108"/>
<line class="ax" x1="30.0" y1="108" x2="30.0" y2="113"/>
<text class="s" x="30.0" y="127" text-anchor="middle">0 ms</text>
<line class="ax" x1="262.5" y1="108" x2="262.5" y2="113"/>
<text class="s" x="262.5" y="127" text-anchor="middle">45 ms</text>
<line class="ax" x1="340.0" y1="108" x2="340.0" y2="113"/>
<text class="s" x="340.0" y="127" text-anchor="middle">60 ms</text>
<line class="ax" x1="650.0" y1="108" x2="650.0" y2="113"/>
<text class="s" x="650.0" y="127" text-anchor="middle">120 ms</text>
<text class="t b" x="30" y="170">Same-key cooldown: clock starts when you press the key</text>
<text class="s" x="30" y="188">time from the last kept press of the same key to the next press</text>
<rect x="30.0" y="198" width="568.3" height="34" fill="#c8323c"/>
<text class="in" x="314.2" y="220" text-anchor="middle">drop</text>
<rect x="598.3" y="198" width="51.7" height="34" fill="#2e8b57"/>
<text class="in" x="624.2" y="220" text-anchor="middle">keep</text>
<line class="ax" x1="30" y1="232" x2="650" y2="232"/>
<line class="ax" x1="30.0" y1="232" x2="30.0" y2="237"/>
<text class="s" x="30.0" y="251" text-anchor="middle">0 ms</text>
<line class="ax" x1="598.3" y1="232" x2="598.3" y2="237"/>
<text class="s" x="598.3" y="251" text-anchor="middle">110 ms</text>
<line class="ax" x1="650.0" y1="232" x2="650.0" y2="237"/>
<text class="s" x="650.0" y="251" text-anchor="middle">120 ms</text>
<text class="s" x="30" y="282">? = wait Short hold (30 ms): released sooner = drop,</text>
<text class="s" x="30" y="298">still held = keep (delivered 30 ms late)</text>
</svg>
